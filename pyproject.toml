[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "econoclast"
version = "2.0.1"
description = "A desktop app where an assassin from the Ravenna mosaics (Claude Code or Codex, fully autonomous) tests empirical-economics papers: fetches the paper and data, builds a local quant workshop, reproduces and attacks the headline result."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "shoal-rat" }]
maintainers = [{ name = "shoal-rat" }]
keywords = [
    "economics", "econometrics", "p-hacking", "research-integrity", "replication",
    "specification-curve", "agent", "claude-code", "codex", "mcp", "desktop-app", "mosaic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing",
]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "pypdf>=4.2",
    "mcp>=1.2",
    "pywebview>=5.0",
    "pillow>=10.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# PyMuPDF reads PDFs (text and tables) noticeably better but is AGPL-3.0, so it is
# opt-in and the default install stays permissive (pypdf is BSD).
pdf = ["pymupdf>=1.24"]
excel = ["openpyxl>=3.1", "pyarrow>=14"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]
all = ["pymupdf>=1.24", "openpyxl>=3.1", "pyarrow>=14"]

[project.urls]
Homepage = "https://github.com/shoal-rat/econoclast"
Repository = "https://github.com/shoal-rat/econoclast"
Issues = "https://github.com/shoal-rat/econoclast/issues"
Documentation = "https://github.com/shoal-rat/econoclast/tree/main/docs"

[project.scripts]
econoclast = "econoclast.cli:app"
clast = "econoclast.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
econoclast = ["py.typed", "app/web/*", "app/web/*/*", "app/web/*/*/*", "app/web/*/*/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# cli.py reconfigures stdout/stderr to UTF-8 before importing rich/typer, which
# must therefore come after that block.
"src/econoclast/cli.py" = ["E402"]
"tools/art/*.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
