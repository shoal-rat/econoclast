# Econoclast configuration. Copy to `econoclast.yaml` and edit.
# Everything here is optional. Econoclast runs on Claude Code or Codex; there are
# no API keys and no offline mode.

# ---------------------------------------------------------------------------
# Backend. Econoclast drives the `claude` or `codex` CLI as a subprocess, using
# that CLI's own subscription auth. "auto" tries Claude Code first, then Codex.
# ---------------------------------------------------------------------------
backend: auto                 # auto | claude | codex
# model: ""                   # optional model override passed to the CLI ("" = its default)
# claude_binary: claude       # path/name of the Claude Code CLI
# codex_binary: codex         # path/name of the Codex CLI
# backend_args: []            # extra args appended to every CLI call

# ---------------------------------------------------------------------------
# Literature retrieval (used by the literature-contradiction attack and to give
# the referee context). All sources are keyless.
# ---------------------------------------------------------------------------
literature:
  enabled: true
  max_results: 12
  sources: [openalex, arxiv, semantic_scholar]        # also: crossref
  local_dirs: []                                       # e.g. ["~/papers/reading-list"]

# ---------------------------------------------------------------------------
# Misc
# ---------------------------------------------------------------------------
blind_default: true           # blind author identity during review (anti prestige-bias)
agent_download: true          # if a download is blocked, let the agent fetch it with its own tools
request_timeout: 240          # seconds per backend call
cache_dir: .econoclast_cache
contact_email: ""             # optional: a polite-pool e-mail raises OpenAlex/Crossref limits
