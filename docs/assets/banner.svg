<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#131c31"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <!-- faint grid -->
  <g stroke="#1e2a44" stroke-width="1">
    <line x1="0" y1="85" x2="1200" y2="85"/>
    <line x1="0" y1="170" x2="1200" y2="170"/>
    <line x1="0" y1="255" x2="1200" y2="255"/>
  </g>

  <!-- wordmark -->
  <text x="70" y="150" fill="#f8fafc" font-size="76" font-weight="800" letter-spacing="1">ECONOCLAST</text>
  <rect x="74" y="172" width="250" height="6" rx="3" fill="url(#accent)"/>
  <text x="74" y="214" fill="#cbd5e1" font-size="27" font-weight="500">An adversarial referee for empirical economics.</text>
  <text x="74" y="252" fill="#8b9bb4" font-size="20">Hunts p-hacking, cherry-picking, and specification search — then re-runs the result.</text>
  <text x="74" y="294" fill="#64748b" font-size="17" font-family="Consolas, monospace">econoclast verify paper.pdf</text>

  <!-- specification-curve motif -->
  <g transform="translate(820,60)">
    <line x1="0" y1="220" x2="320" y2="220" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="220" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="150" x2="320" y2="150" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 5"/>
    <g fill="#64748b">
      <circle cx="18" cy="206" r="4.5"/><circle cx="40" cy="198" r="4.5"/><circle cx="62" cy="194" r="4.5"/>
      <circle cx="84" cy="186" r="4.5"/><circle cx="106" cy="182" r="4.5"/><circle cx="128" cy="176" r="4.5"/>
      <circle cx="150" cy="170" r="4.5"/><circle cx="172" cy="162" r="4.5"/><circle cx="194" cy="158" r="4.5"/>
    </g>
    <g fill="#ef4444">
      <circle cx="216" cy="120" r="5"/><circle cx="238" cy="104" r="5"/><circle cx="260" cy="86" r="5"/>
      <circle cx="282" cy="64" r="5"/><circle cx="304" cy="40" r="5"/>
    </g>
    <text x="0" y="244" fill="#8b9bb4" font-size="14">specifications, sorted by estimate</text>
  </g>
</svg>
